[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ode-exact-fdm-pinn"
version = "0.1.0"
description = "Reproducible comparison of exact, finite-difference, and PINN solutions for a boundary-value ODE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "torch>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
